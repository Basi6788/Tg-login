<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Uchiha Bot King</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --aurora-glow: rgba(0, 255, 255, 0.4);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: radial-gradient(circle at top right, #1a1a2e, #0f0c29, #16213e);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.02);
            width: 100%;
            max-width: 400px;
            padding: 40px 30px;
        }

        .aurora-input {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            color: white;
            transition: all 0.3s ease;
        }

        .aurora-input:focus {
            outline: none;
            border-color: #00d2ff;
            box-shadow: 0 0 15px var(--aurora-glow);
        }

        .aurora-btn {
            background: linear-gradient(45deg, #00d2ff, #3a7bd5);
            box-shadow: 0 4px 15px var(--aurora-glow);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .aurora-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.6);
        }

        .crown-icon {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.5));
        }
    </style>
</head>
<body>

    <div class="glass-card">
        <div class="crown-icon">👑</div>
        <h2 class="text-2xl font-bold text-center mb-2 tracking-wider">Uchiha Admin</h2>
        <p class="text-center text-gray-400 text-sm mb-8">Access your Bot Empire</p>

        <form action="/login" method="POST" class="flex flex-col gap-5">
            <div>
                <label class="block text-xs text-cyan-400 mb-1 ml-1 uppercase tracking-wider">Admin ID</label>
                <input type="text" name="username" placeholder="Enter your ID..." required
                    class="aurora-input w-full px-4 py-3 rounded-xl">
            </div>

            <div>
                <label class="block text-xs text-cyan-400 mb-1 ml-1 uppercase tracking-wider">Secret Key</label>
                <input type="password" name="password" placeholder="••••••••" required
                    class="aurora-input w-full px-4 py-3 rounded-xl">
            </div>

            <button type="submit" class="aurora-btn w-full py-3 rounded-xl mt-4">
                Enter Dashboard
            </button>
        </form>
    </div>

</body>
</html>
